<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>SubForge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232938"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <radialGradient id="cone" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0.04"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- speaker: outer surround, cone, dust cap -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffb000" stroke-width="5.5"/>
  <circle cx="32" cy="32" r="15" fill="url(#cone)" stroke="#ffb000" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="5.2" fill="#ffb000"/>
</svg>
